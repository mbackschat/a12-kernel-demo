# The A12 packages depend on each other by version number (e.g. kernel-md-facade needs
# kernel-core-runtime-ts 31.3.1), and those versions exist on no npm registry. These overrides send
# every such reference to the tarballs that `gradle tsVendor` copies from the a12-kernel-bootstrap kit.
# No lockfile: it would pin the vendored tarballs by hash, and that hash changes with every kit build because
# the gzip header records the build platform. The tarball file names already pin the exact A12 versions.
lockfile: false

overrides:
  "@com.mgmtp.a12.base/base-model-api": "file:vendor/com.mgmtp.a12.base-base-model-api-30.1.1.tgz"
  "@com.mgmtp.a12.kernel/kernel-core-runtime-api-ts": "file:vendor/com.mgmtp.a12.kernel-kernel-core-runtime-api-ts-31.3.1.tgz"
  "@com.mgmtp.a12.kernel/kernel-core-runtime-ts": "file:vendor/com.mgmtp.a12.kernel-kernel-core-runtime-ts-31.3.1.tgz"
  "@com.mgmtp.a12.kernel/kernel-md-facade": "file:vendor/com.mgmtp.a12.kernel-kernel-md-facade-31.3.1.tgz"
  "@com.mgmtp.a12.utils/utils-collections": "file:vendor/com.mgmtp.a12.utils-utils-collections-7.0.1.tgz"
  "@com.mgmtp.a12.utils/utils-localization": "file:vendor/com.mgmtp.a12.utils-utils-localization-8.1.0.tgz"
  "@com.mgmtp.a12.utils/utils-logging": "file:vendor/com.mgmtp.a12.utils-utils-logging-7.1.0.tgz"
